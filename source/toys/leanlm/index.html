<!doctype html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>Lean LM - Lightweight tools powered by LLM</title>
  <script :version="0.1.0-alpha.1" src="/toy/veps.js"></script>
</head>

<style>
  #\$cfg,
  #\$cfg:not(:checked) ~ section {
    display: none;
  }
  section {
    position: absolute;
    inset: 46px 8px 0 8px;
    display: grid;
    grid: repeat(9, 30px) 1fr / 5em 1fr;
    gap: 8px;
    background: Canvas;
  }
  body {
    display: grid;
    grid: 30px 1fr 1fr / 30px 1fr 30px;
    gap: 8px;
    height: calc(100vh - 16px);
  }
  body > :is(label, select, button) {
    line-height: 30px;
    text-align: center;
    background: Canvas;
    border: 1px solid #777;
  }
  textarea {
    grid-column: span 3;
  }
  #\$cfg + label::after {
    content: "≡";
  }
  #\$cfg:checked + label::after {
    content: "×";
  }
  #\$go::after {
    content: ">";
  }
  #\$go.pending::after {
    content: "•\00a0\00a0";
    animation: 1s linear infinite pending;
  }
  @keyframes pending {
    33% {
      content: "\00a0•\00a0";
    }
    66% {
      content: "\00a0\00a0•";
    }
  }
</style>

<body>
  <input id="$cfg" type="checkbox" />
  <label for="$cfg"></label>
  <select id="$op">
    <option value="normal_chat">Normal Chat</option>
    <option value="translate_en_zh">Translate en · zh</option>
    <option value="translate_vi_zh">Translate vi · zh</option>
  </select>
  <button id="$go"></button>
  <section id="$cfgfields">
    <label for="$baseURL">Base URL</label>
    <input id="$baseURL" placeholder="https://api.openai.com/v1/" />
    <label for="$apiKey">API Key</label>
    <input id="$apiKey" placeholder="sk-xxx" />
    <label for="$model">Model</label>
    <input id="$model" placeholder="gpt-4o-mini" />
  </section>
  <textarea id="$in" placeholder="Input"></textarea>
  <textarea id="$out" placeholder="Output"></textarea>
</body>

<script>
  // ln -sf ../../../source/toys/leanlm/index.html public/toy/leanlm/index.html
  if (localStorage.leanlm) {
    const { baseURL, apiKey, model, op } = JSON.parse(localStorage.leanlm);
    $baseURL.value = baseURL;
    $apiKey.value = apiKey;
    $model.value = model;
    $op.value = op;
  } else {
    $cfg.click();
  }
  $cfgfields.oninput = $op.onchange = () => {
    localStorage.leanlm = JSON.stringify({
      baseURL: ($baseURL.value = $baseURL.value.trim().replace(/$\//, "")),
      apiKey: ($apiKey.value = $apiKey.value.trim()),
      model: ($model.value = $model.value.trim()),
      op: $op.value,
    });
  };
  const go = async () => {
    const { baseURL, apiKey, model } = JSON.parse(localStorage.leanlm);
    let content = $in.value;
    if ($op.value.startsWith("translate_")) {
      let foreign;
      if ($op.value === "translate_en_zh") foreign = "English";
      if ($op.value === "translate_vi_zh") foreign = "Vietnamese";
      content = `Translate the following text, if it is ${foreign}, translate to Chinese; if Chinese, translate to ${foreign}. Output only the translation. Text to translate:\n\n${content}`;
    }
    const response = await fetch(baseURL + "/chat/completions", {
      method: "POST",
      headers: { Authorization: apiKey },
      body: JSON.stringify({
        model: model,
        thinking: { type: "disabled" },
        stream: false,
        messages: [{ role: "user", content }],
      }),
    });
    $out.value = (await response.json()).choices[0].message.content;
  };
  $go.onclick = () => {
    $go.classList.add("pending");
    go().finally(() => $go.classList.remove("pending"));
  };
</script>
